modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Generated by tools/artgen/logo.py; pixel art, so no blur when the mod list scales it.
logoFile="supernaturalcraft_logo.png"
logoBlur=false
# Third-person arm poses for the Colt (client/colt/ColtArmPoses).
enumExtensions="META-INF/enumextensions.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="geckolib"
type="required"
versionRange="[4.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="curios"
type="optional"
versionRange="[9.5,)"
ordering="AFTER"
side="BOTH"

# Nations & War (optional): guilds become nations, the Pit, the Host and SucroCorp run their own (compat/nationsandwar).
[[dependencies."${mod_id}"]]
modId="nationsandwar"
type="optional"
versionRange="[0.2,)"
ordering="AFTER"
side="BOTH"

# PlayerAnimationLib (required on clients): the Colt fired, reloaded and spun, and the flight pose on wings (compat/pal).
[[dependencies."${mod_id}"]]
modId="player_animation_library"
type="required"
versionRange="[1.1.6,)"
ordering="AFTER"
side="CLIENT"
