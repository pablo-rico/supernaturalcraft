modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Third-person arm poses for the Colt (client/colt/ColtArmPoses).
enumExtensions="META-INF/enumextensions.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="geckolib"
type="required"
versionRange="[4.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="curios"
type="optional"
versionRange="[9.5,)"
ordering="AFTER"
side="BOTH"

# PlayerAnimationLib: with it, other players see the Colt fired, reloaded and spun (compat/pal).
[[dependencies."${mod_id}"]]
modId="player_animation_library"
type="optional"
versionRange="[1.1.6,)"
ordering="AFTER"
side="CLIENT"
