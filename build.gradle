plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '[7.0.59,7.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        modSource project.sourceSets.main
        // -Paudit : audit counters on from the start, written to sn_audit.md when the server stops (see debug/AuditStats).
        if (project.hasProperty('audit')) {
            systemProperty 'sn.audit', 'true'
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // ./gradlew runClient -Ppreview : open the dev preview world straight away (see DevPreview).
        if (project.hasProperty('preview')) {
            arguments.addAll '--quickPlaySingleplayer', 'sn_preview'
        }
        // SN_PREVIEW=tour ./gradlew runClient -Ptour : the screenshot tour in the real world sn_tour (see TourPreview), at 1280x720.
        if (project.hasProperty('tour')) {
            arguments.addAll '--quickPlaySingleplayer', 'sn_tour', '--width', '1280', '--height', '720'
        }
        // ./gradlew runClient -Pjoin=localhost [-Puser=Name] : straight into a server (load audits with several clients).
        if (project.hasProperty('join')) {
            arguments.addAll '--quickPlayMultiplayer', project.property('join').toString()
        }
        if (project.hasProperty('user')) {
            arguments.addAll '--username', project.property('user').toString()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.add '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://libraries.minecraft.net"
                // Mojang publica algunos artefactos nativos sin metadata Maven completa.
                metadataSources {
                    artifact()
                    mavenPom()
                }
            }
        }
        filter {
            includeGroup "com.mojang"
        }
    }
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content { includeGroup("software.bernie.geckolib") }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup("top.theillusivec4.curios") }
    }
    maven {
        name = "Redlance"
        url = "https://repo.redlance.org/public"
        content {
            includeGroup "com.zigythebird.playeranim"
            includeGroup "com.zigythebird"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Nations & War (optional in the released jar): only compat/nationsandwar imports it. The jar sits in libs/
    // (./gradlew syncNationsAndWar copies it from ../nationsandwar). Dev runs load it by default; -PnoNw runs without it
    // (./gradlew runGameTestServer -PnoNw: SupernaturalCraft alone).
    compileOnly files("libs/nationsandwar_${minecraft_version}_${nationsandwar_version}.jar")
    if (!project.hasProperty('noNw')) {
        runtimeOnly files("libs/nationsandwar_${minecraft_version}_${nationsandwar_version}.jar")
    }

    // ./gradlew runClient -Pshaders : Iris + Sodium in the dev client, to check the FX under shader packs
    // (packs in runs/client/shaderpacks, the active one in runs/client/config/iris.properties).
    if (project.hasProperty('shaders')) {
        runtimeOnly "maven.modrinth:sodium:${sodium_version}"
        runtimeOnly "maven.modrinth:iris:${iris_version}"
    }

    // PlayerAnimationLib: required (v0.20), the Colt's whole-body animations and the flight pose (compat/pal).
    implementation "com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}"
    compileOnly "com.zigythebird.playeranim:PlayerAnimationLibCore:${pal_version}"

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    // A resource present both hand-written and generated is a migration mistake.
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude '.cache/**'

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}_${minecraft_version}_${mod_version}.jar"

    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// compat/nationsandwar needs the N&W API to compile: fail with a hint instead of "package ... does not exist".
tasks.named('compileJava') {
    def nwJar = file("libs/nationsandwar_${minecraft_version}_${nationsandwar_version}.jar")
    doFirst {
        if (!nwJar.exists()) {
            throw new GradleException("Missing ${nwJar.name} in libs/: run ./gradlew syncNationsAndWar (CI builds it from the N&W tag v${nationsandwar_version}).")
        }
    }
}

// Copies the Nations & War jar built next door (../nationsandwar, ./gradlew build there first) into libs/.
tasks.register('syncNationsAndWar', Copy) {
    from("../nationsandwar/build/libs") { include "nationsandwar_${minecraft_version}_${nationsandwar_version}.jar" }
    into "libs"
}
